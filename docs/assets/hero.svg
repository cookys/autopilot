<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Autopilot — the CEO-agent for development work</title>
  <desc id="desc">Dark mission-control banner: aircraft mark, the lines "Claude Code makes you faster. Autopilot lets you step away.", the signature "Get the decision right. Let the system finish.", and capability chips.</desc>
  <defs>
    <radialGradient id="glow" cx="78%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1b2340"/>
      <stop offset="55%" stop-color="#0d1322"/>
      <stop offset="100%" stop-color="#07090f"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#334155" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <style>
      .word  { font: 700 30px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #e6ebf5; letter-spacing: 0.5px; }
      .h1a   { font: 800 44px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #f1f5fb; }
      .h1b   { font: 800 44px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #a5b4fc; }
      .sig   { font: 600 19px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #f5a524; letter-spacing: 0.3px; }
      .chip  { font: 600 14px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #cbd5e1; }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#glow)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <!-- wordmark row -->
  <g transform="translate(56 34) scale(0.72)">
    <g transform="translate(6 -6) rotate(45 32 32)">
      <path d="M27 57 L23 63" stroke="#A5B4FC" stroke-width="3.4" stroke-linecap="round" fill="none"/>
      <path d="M32 57.5 L32 65" stroke="#F5A524" stroke-width="3.6" stroke-linecap="round" fill="none"/>
      <path d="M37 57 L41 63" stroke="#818CF8" stroke-width="3.4" stroke-linecap="round" fill="none"/>
      <path fill="#C5CDDC" fill-rule="evenodd" d="M32 8 L36 18 L36 24 L54 40 L54 44 L36 36 L35 46 L45 54 L45 57 L34 52 L33.5 55 L30.5 55 L30 52 L19 57 L19 54 L29 46 L28 36 L10 44 L10 40 L28 24 L28 18 Z M30.5 15 L33.5 15 L33.5 20 L30.5 20 Z"/>
    </g>
  </g>
  <text x="118" y="68" class="word">Autopilot</text>

  <!-- headline -->
  <text x="58" y="140" class="h1a">Claude Code makes you faster.</text>
  <text x="58" y="192" class="h1b">Autopilot lets you step away.</text>

  <!-- signature -->
  <text x="58" y="232" class="sig">Get the decision right. Let the system finish.</text>

  <!-- chips -->
  <g transform="translate(58 252)">
    <rect x="0" y="0" width="92" height="26" rx="13" fill="none" stroke="#3b4a6b" stroke-width="1"/>
    <circle cx="16" cy="13" r="3.5" fill="#4a90d9"/>
    <text x="27" y="18" class="chip">30 skills</text>
    <rect x="102" y="0" width="94" height="26" rx="13" fill="none" stroke="#3b4a6b" stroke-width="1"/>
    <circle cx="118" cy="13" r="3.5" fill="#7c9e8c"/>
    <text x="129" y="18" class="chip">3 agents</text>
    <rect x="206" y="0" width="94" height="26" rx="13" fill="none" stroke="#3b4a6b" stroke-width="1"/>
    <circle cx="222" cy="13" r="3.5" fill="#6b8e6b"/>
    <text x="233" y="18" class="chip">25 hooks</text>
    <rect x="310" y="0" width="152" height="26" rx="13" fill="none" stroke="#8a6a2a" stroke-width="1"/>
    <circle cx="326" cy="13" r="3.5" fill="#f5a524"/>
    <text x="337" y="18" class="chip">zero dependencies</text>
  </g>

  <!-- flight path + aircraft, right side -->
  <path d="M660 210 C 760 150, 850 220, 940 150 S 1100 90, 1150 110"
        fill="none" stroke="#5c6b8a" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round" opacity="0.9"/>
  <circle cx="660" cy="210" r="4" fill="#f5a524"/>
  <circle cx="940" cy="150" r="3" fill="#818cf8"/>
  <g transform="translate(1040 40) scale(1.7)">
    <g transform="translate(6 -6) rotate(45 32 32)">
      <path d="M27 57 L23 63" stroke="#A5B4FC" stroke-width="3.4" stroke-linecap="round" fill="none"/>
      <path d="M32 57.5 L32 65" stroke="#F5A524" stroke-width="3.6" stroke-linecap="round" fill="none"/>
      <path d="M37 57 L41 63" stroke="#818CF8" stroke-width="3.4" stroke-linecap="round" fill="none"/>
      <path fill="#C5CDDC" fill-rule="evenodd" d="M32 8 L36 18 L36 24 L54 40 L54 44 L36 36 L35 46 L45 54 L45 57 L34 52 L33.5 55 L30.5 55 L30 52 L19 57 L19 54 L29 46 L28 36 L10 44 L10 40 L28 24 L28 18 Z M30.5 15 L33.5 15 L33.5 20 L30.5 20 Z"/>
    </g>
  </g>
</svg>
