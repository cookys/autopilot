name: tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# A superseded push's run is dead signal — cancel it instead of queueing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-suite:
    runs-on: ubuntu-latest
    # The suite spawns process groups and plays with setsid/flock; a hang here
    # must not burn the 6-hour default. Full run is ~8 min.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # check-node-report (evidence pointers via git show) and check-optin-changelog
          # (base-ref walk) need real history — shallow clone kept CI red for 100+ runs.
          fetch-depth: 0

      # owner-kernel P0's supervised-profile probe needs a real Linux sandbox +
      # syscall tracer. Without them the probe dies on `spawn bwrap ENOENT` /
      # `spawnSync strace ENOENT` and ALL 8 assertions of
      # hooks/tests/owner-kernel-p0-supervised-profile.test.sh fail — which is what
      # turned develop red on 2026-07-25 (the failure predates the commit that
      # surfaced it; the run that would have shown it was cancelled by a later push).
      # Declared as a prerequisite in docs/projects/2026-07-20-owner-kernel-governance/README.md
      # ("Linux sandbox/runtime prerequisite | Yes"). Installing them — rather than
      # skipping the probe — is deliberate: those 8 assertions ARE the security
      # controls (forged intent rejected, capability exposure rejected, protected
      # write rejected, receipt-mount rejected, payload tamper rejected). A skip
      # would turn a security gate into a silent pass.
      - name: Install sandbox prerequisites (owner-kernel P0 supervised profile)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap strace
          bwrap --version
          strace -V | head -1

      # Ubuntu 24.04 ships `kernel.apparmor_restrict_unprivileged_userns=1`, an AppArmor
      # restriction that did not exist on 22.04 and does not exist on most other distros. It
      # blocks unconfined binaries from creating unprivileged user namespaces, so bwrap (which
      # is NOT setuid here: `-rwxr-xr-x root root`) cannot get a userns and dies with
      #   bwrap: setting up uid map: Permission denied
      #   bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted
      # taking all 8 owner-kernel P0 supervised-profile controls down with it.
      #
      # Measured on the runner (diagnostic run 2026-07-25, ubuntu-24.04.4, kernel 6.17-azure):
      #   unprivileged `bwrap --unshare-net`        -> rc=1 (RTM_NEWADDR)
      #   `sudo bwrap --unshare-net`                -> rc=0
      #   the probe under `sudo -E`                 -> rc=1  (STILL fails: it re-spawns bwrap
      #                                                without inheriting root, so "just run
      #                                                the tests as root" is NOT a fix)
      # Clearing the knob is therefore the option that keeps the probe running exactly as
      # designed — UNPRIVILEGED, in a real user namespace — instead of either running security
      # tests as root or declaring the controls unverifiable in CI. It only relaxes an
      # Ubuntu-24.04-specific hardening on an ephemeral runner VM, not in the sandbox itself.
      - name: Allow unprivileged user namespaces (Ubuntu 24.04 AppArmor restriction)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Fail loudly if bwrap still cannot build a sandbox — a silent regression here would
          # take the 8 security controls down again while the suite blames application logic.
          if ! bwrap --unshare-user --unshare-net --dev-bind / / true; then
            echo "::error::bwrap still cannot create an unprivileged user namespace; the owner-kernel P0 controls cannot be verified in this environment" >&2
            exit 1
          fi
          echo "bwrap unprivileged sandbox: OK"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # node:test (the built-in runner used by hooks/*.test.js) requires
          # Node 18+. 22 is the current LTS as of this commit.
          node-version: '22'

      - name: Ensure repo-tracked symlinks resolve
        run: bash scripts/setup-symlinks.sh

      # Persist the L1 JS runtime (jest+vitest) so check-test-integrity-l1.test.sh
      # resolves offline after the first warm. Path must match AUTOPILOT_TEST_CACHE
      # below; key rotates when the pinned versions in ensure_js_runtime change.
      - name: Cache L1 JS test runtime
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/autopilot-test-cache
          key: ${{ runner.os }}-l1-js-runtime-jest29.7.0-vitest2.1.8

      - name: Run hooks test suite (L1 unit + L2 integration)
        # Explicit `shell: bash` is LOAD-BEARING: it makes GH run `bash -eo
        # pipefail {0}`. The implicit default is `bash -e {0}` WITHOUT pipefail,
        # which let `| tee` swallow the suite's exit 1 — CI showed green over
        # real test failures on 2026-07-16 (caught by a foreman's honest local
        # run disagreeing with a green CI on the same commit).
        shell: bash
        env:
          AUTOPILOT_TEST_CACHE: ${{ runner.temp }}/autopilot-test-cache
        run: bash hooks/tests/run.sh --parallel 2>&1 | tee "$RUNNER_TEMP/hooks-suite.log"

      - name: Upload suite log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hooks-suite-log
          path: ${{ runner.temp }}/hooks-suite.log
          if-no-files-found: ignore

      - name: Sync/check rituals (manifest-driven)
        # Single entry point for every sync/check ritual (version mirrors,
        # agent-bodies, model-routing, codex + opencode payloads, README parity,
        # hook inventory, canonical invariants, CLAUDE.md inventory). Registered
        # in scripts/sync-manifest.json; replaces the hand-copied per-ritual steps.
        run: bash scripts/sync-all.sh --check

      - name: Roster-field report (advisory)
        # NOT a gate. Prints the roster's three-bucket table into the job log so a
        # field that loses its last consumer is visible on every run, not only when
        # someone remembers to look. Deliberately NOT registered as a sync-all
        # ritual: sync-all only surfaces a ritual's output when it FAILS, so a
        # never-failing report registered there would print nothing while appearing
        # in the checks list as passing. `continue-on-error` keeps a broken report
        # (exit 2 + REPORT-HEALTH) from failing the build while still colouring the
        # step red. Plan: docs/plans/2026-07-25-roster-field-report.md
        continue-on-error: true
        run: node scripts/report-roster-field-consumers.js

      - name: Release-hygiene gate
        # Check 7 (slash-entry probe) needs a `claude` binary + auth — neither
        # exists on a CI runner. The skip is loud by design; giving CI an API
        # key instead would leak probe transcripts into the log. Never do that.
        env:
          AUTOPILOT_SKIP_SLASH_PROBE: "1"
        run: bash scripts/preflight-release.sh

      - name: Cross-agent portability gate
        # preflight-portability self-skips OpenCode checks when the binary
        # isn't on PATH, which it won't be in CI. The other 9 checks still
        # exercise hooks, symlinks, validate.sh, and sync-version --check.
        run: bash scripts/preflight-portability.sh
